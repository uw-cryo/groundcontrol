name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Let pyproj fetch transformation grids (e.g. GEOID18, NADCON5) from the
      # PROJ CDN so the grid-dependent CRS tests exercise real chains instead
      # of skipping. Downloaded grids land in the user-writable PROJ dir,
      # cached below.
      PROJ_NETWORK: "ON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache PROJ grids
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/proj
            ~/.cache/proj
          key: proj-grids-${{ runner.os }}-v1
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run offline test suite
        # "network" marks tests that hit live APIs (NGS/NGL/USGS); they are
        # excluded from CI gating and can be run manually via workflow_dispatch
        # on the network-tests job below.
        run: python -m pytest -m "not network" -ra

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check src tests --output-format=github

  network-tests:
    name: live API tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROJ_NETWORK: "ON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run network-marked tests
        run: python -m pytest -m "network" -ra
