[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: this name is held on PyPI by an unrelated abandoned package, and PyPI's
# similar-name check blocks every separator variant (ground-control, ...) while
# it stands. Do not attempt a PyPI upload; see the Install section of README.md.
name = "groundcontrol"
version = "0.1.2"
description = "Fetch ground control points for any AOI and assess DEM accuracy, with rigorous 3D CRS/datum/epoch handling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "UW Terrain Analysis and Cryosphere Observation Lab" }]
keywords = ["DEM", "accuracy", "GNSS", "control points", "geodesy", "CRS", "lidar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
# Version floors per docs/plan.md packaging section (implied by the verified
# CRS directives in docs/crs_implementation.md).
dependencies = [
    "numpy",
    "pandas",
    "geopandas>=1.0",  # read_parquet bbox pushdown
    "pyproj>=3.6",     # only_best=, CRS.to_2d (wheels bundle PROJ >= 9.2)
    "shapely>=2.0",
    "rasterio",
    "rioxarray",
    "scipy",           # xarray .interp(method="linear") — sample.py's default method
    "requests",
    "matplotlib",
    "matplotlib-scalebar",  # house scalebar standard (env figures.md 2026-08-11)
    "pyarrow>=14",
]

[project.optional-dependencies]
kml = ["fiona"]        # KML export (simplekml fallback documented in plan)
dev = ["pytest", "ruff>=0.16"]

[project.urls]
Repository = "https://github.com/uw-cryo/groundcontrol"

[project.scripts]
groundcontrol-fetch = "groundcontrol.cli:fetch_control_main"
groundcontrol-assess = "groundcontrol.cli:assess_dem_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundcontrol = ["data/*.geojson", "data/*.dat", "data/*.md", "data/*.cpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests requiring network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selection is explicit and stays explicit (issue #9): inheriting whatever the
# installed ruff calls "default" is what broke lint on every branch when 0.16.0
# widened it. Adding a rule set here is a deliberate act with a re-lint attached.
select = [
    "E4", "E7", "E9", "E501",  # pycodestyle subset + the declared line-length
    "F",                       # pyflakes
    "I",                       # import sorting
    "UP",                      # pyupgrade (floor is py310)
    "B",                       # bugbear — incl. B905 zip(strict=)
    "BLE",                     # blind except; waived per-site where deliberate
    "SIM",                     # simplifications
    "RUF",                     # ruff-native
    "C4",                      # comprehension/collection literals
    "PIE", "ISC", "FURB", "DTZ",
    "PLW", "PLR0402",          # pylint: warnings only, plus the import alias rule
]
ignore = [
    # Prose in docstrings/comments is full of en dashes, ×, σ, ±. Ambiguity
    # warnings here are noise, not a latent homoglyph bug.
    "RUF001", "RUF002", "RUF003",
    # __all__ lists in crs.py/geodesy.py are grouped by API stage with section
    # comments; alphabetizing them would destroy that structure.
    "RUF022",
]

[tool.ruff.lint.isort]
# keep `from x import A, b as c` on one line instead of splitting the aliased
# member into its own import
combine-as-imports = true
