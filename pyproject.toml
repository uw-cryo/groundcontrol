[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcontrol"
version = "0.1.0.dev0"
description = "Fetch ground control points for any AOI and assess DEM accuracy, with rigorous 3D CRS/datum/epoch handling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "UW Terrain Analysis and Cryosphere Observation Lab" }]
keywords = ["DEM", "accuracy", "GNSS", "control points", "geodesy", "CRS", "lidar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
# Version floors per docs/plan.md packaging section (implied by the verified
# CRS directives in docs/crs_implementation.md).
dependencies = [
    "numpy",
    "pandas",
    "geopandas>=1.0",  # read_parquet bbox pushdown
    "pyproj>=3.5",     # only_best= (wheels bundle PROJ >= 9.2)
    "shapely>=2.0",
    "rasterio",
    "rioxarray",
    "requests",
    "matplotlib",
    "pyarrow>=14",
]

[project.optional-dependencies]
kml = ["fiona"]        # KML export (simplekml fallback documented in plan)
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/uw-cryo/groundcontrol"

[project.scripts]
groundcontrol-fetch = "groundcontrol.cli:fetch_control_main"
groundcontrol-assess = "groundcontrol.cli:assess_dem_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundcontrol = ["data/*.geojson", "data/*.dat", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests requiring network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
